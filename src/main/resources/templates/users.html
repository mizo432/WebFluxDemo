<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <title>ユーザー一覧</title>
    <link rel="stylesheet" href="/css/dads-global.css"/>
    <link rel="stylesheet" href="/css/dads-components.css"/>
</head>
<body>
<header class="dads-header">
    <div class="dads-header__inner">
        <h1 class="dads-header__title dads-u-dsp-03B-130">ユーザー管理</h1>
    </div>
</header>

<main class="dads-l-container dads-main">
    <div class="dads-page-header">
        <h1 class="dads-page-header__title dads-u-std-25B-130">ユーザー一覧</h1>
        <a th:href="@{/users/new}" class="dads-btn dads-btn--primary">ユーザーを追加</a>
    </div>

    <div th:if="${users.empty}" class="dads-empty">
        <p class="dads-u-std-17N-170">ユーザーがいません。</p>
    </div>

    <div th:if="${!users.empty}" class="dads-table-wrapper">
        <table class="dads-table">
            <thead>
            <tr>
                <th class="dads-u-std-17B-150">ID</th>
                <th class="dads-u-std-17B-150">名前</th>
                <th class="dads-u-std-17B-150">メール</th>
                <th class="dads-u-std-17B-150">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td class="dads-u-std-17N-150" th:text="${user.id}"></td>
                <td class="dads-u-std-17N-150" th:text="${user.name}"></td>
                <td class="dads-u-std-17N-150" th:text="${user.email}"></td>
                <td>
                    <div style="display: flex; gap: 8px;">
                        <a th:href="@{/users/edit/{id}(id=${user.id})}" class="dads-btn dads-btn--secondary dads-btn--small">編集</a>
                        <form th:action="@{/api/users/{id}(id=${user.id})}" method="post" style="margin: 0;">
                            <input type="hidden" name="_method" value="DELETE"/>
                            <button type="submit" class="dads-btn dads-btn--danger dads-btn--small" onclick="return confirm('本当に削除しますか？')">削除</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer class="dads-footer">
    <p class="dads-u-std-14N-150">WebFluxDemo - デジタル庁デザインシステム</p>
</footer>
</body>
</html>
