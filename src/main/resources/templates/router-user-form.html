<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <title>ユーザーフォーム（RouterFunction）</title>
    <link rel="stylesheet" href="/css/dads-global.css"/>
    <link rel="stylesheet" href="/css/dads-components.css"/>
</head>
<body>
<header class="dads-header">
    <div class="dads-header__inner">
        <h1 class="dads-header__title dads-u-dsp-03B-130">ユーザー管理</h1>
    </div>
</header>

<main class="dads-l-container dads-main">
    <h1 class="dads-u-std-25B-130" style="margin-bottom: 24px;">
        <span th:text="${user.id != null} ? 'ユーザーを編集' : 'ユーザーを追加'">ユーザーフォーム</span>
        <span class="dads-badge">RouterFunction</span>
    </h1>

    <div class="dads-card">
        <form action="/router/users/submit" method="post">

            <input type="hidden" name="id" th:value="${user.id}"/>

            <div class="dads-form-group">
                <label for="name" class="dads-form-label dads-form-label--required">名前</label>
                <input type="text" id="name" name="name"
                       th:value="${user.name}"
                       class="dads-form-input"
                       required placeholder="名前を入力してください"/>
            </div>

            <div class="dads-form-group">
                <label for="email" class="dads-form-label dads-form-label--required">メール</label>
                <input type="email" id="email" name="email"
                       th:value="${user.email}"
                       class="dads-form-input"
                       required placeholder="メールを入力してください"/>
            </div>

            <div class="dads-actions dads-actions--right">
                <a href="/router/users" class="dads-btn dads-btn--secondary">キャンセル</a>
                <button type="submit" class="dads-btn dads-btn--primary" th:text="${user.id != null} ? '更新' : '登録'">登録</button>
            </div>
        </form>
    </div>
</main>

<footer class="dads-footer">
    <p class="dads-u-std-14N-150">WebFluxDemo - デジタル庁デザインシステム</p>
</footer>
</body>
</html>
