<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="ja">
<head>
    <meta charset="UTF-8"/>
    <title>エラーが発生しました</title>
    <link rel="stylesheet" href="/css/dads-global.css"/>
    <link rel="stylesheet" href="/css/dads-components.css"/>
</head>
<body>
<header class="dads-header">
    <div class="dads-header__inner">
        <h1 class="dads-header__title dads-u-dsp-03B-130">ユーザー管理</h1>
    </div>
</header>

<main class="dads-l-container dads-main">
    <div class="dads-card">
        <div class="dads-error-page">
            <div class="dads-error-icon" role="img" aria-label="警告">⚠️</div>
            <h1 class="dads-u-std-25B-130 dads-error-title">エラーが発生しました</h1>
            <p class="dads-u-std-17N-170 dads-error-message" th:text="${error} ?: '予期せぬエラーが発生しました。'">エラーメッセージ</p>

            <!-- 開発環境でのみ詳細情報を表示 -->
            <div th:if="${env == 'dev'}" class="dads-error-details">
                <p class="dads-u-std-14N-150">
                    <strong>ステータスコード:</strong>
                    <span th:text="${status} ?: '不明'">404</span>
                </p>
                <p class="dads-u-std-14N-150">
                    <strong>時刻:</strong>
                    <span th:text="${timestamp} ?: ''">2026-11-06</span>
                </p>
                <p class="dads-u-std-14N-150" th:if="${path}">
                    <strong>パス:</strong>
                    <span th:text="${path}">/path</span>
                </p>
                <p class="dads-u-std-14N-150" th:if="${message}">
                    <strong>メッセージ:</strong>
                    <span th:text="${message}">メッセージ</span>
                </p>
            </div>

            <div class="dads-actions dads-actions--center">
                <a href="/" class="dads-btn dads-btn--primary">トップページに戻る</a>
                <button type="button" class="dads-btn dads-btn--secondary" onclick="history.back()">前のページに戻る</button>
            </div>
        </div>
    </div>
</main>

<footer class="dads-footer">
    <p class="dads-u-std-14N-150">WebFluxDemo - デジタル庁デザインシステム</p>
</footer>
</body>
</html>
