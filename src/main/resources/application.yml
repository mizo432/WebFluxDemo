spring:
  application:
    name: WebFluxDemo
  webflux:
    problemdetails:
      enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/${DB_NAME:webfluxdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  data:
    r2dbc:
      repositories:
        enabled: true
  flyway:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:webfluxdb}
    user: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    locations: classpath:db/migration

server:
  port: 8080

# セキュリティ設定
security:
  username: ${SECURITY_USERNAME:user}
  password: ${SECURITY_PASSWORD:user}
  web-auth: ${SECURITY_WEB_AUTH:false}
