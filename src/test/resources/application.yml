spring:
  application:
    name: WebFluxDemo
  webflux:
    problemdetails:
      enabled: true
  r2dbc:
    url: r2dbc:h2:mem:///webfluxdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  data:
    r2dbc:
      repositories:
        enabled: true
      schema:
        generate: none
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  flyway:
    enabled: false
    url: jdbc:h2:mem:webfluxdb;DB_CLOSE_DELAY=-1
    user: sa
    password:

server:
  port: 0

security:
  username: user
  password: user
  web-auth: false
